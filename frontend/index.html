<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>txxt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="controls">
        <span class="title">txxt</span>

        <label>
            Radius <output id="radius-val">120</output>px
            <input type="range" id="radius-slider" min="20" max="500" step="5" value="120">
        </label>

        <label>
            <input type="checkbox" id="show-circle" checked>
            Show circle
        </label>

        <button id="save-log">Save log</button>
    </header>

    <main id="engine-container">
        <div id="perf"></div>
        <div id="log"></div>
    </main>

    <script src="txxt.js"></script>
    <script>
        const client = new SidecarClient('engine-container');

        const radiusSlider = document.getElementById('radius-slider');
        const radiusVal    = document.getElementById('radius-val');
        const showCircle   = document.getElementById('show-circle');

        radiusSlider.addEventListener('input', () => {
            const v = parseInt(radiusSlider.value);
            radiusVal.textContent = v;
            client.setFlashlightRadius(v);
        });

        showCircle.addEventListener('change', () => {
            client.setShowCircle(showCircle.checked);
        });

        document.getElementById('save-log').addEventListener('click', () => {
            client.saveLog();
        });
    </script>
</body>
</html>
